<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RiceVi · IA tolva</title>
<style>
  :root { --bg:#0B1F35; --panel:#122B47; --panel2:#16314F; --line:#2C4A6B; --text:#F4EFE6; --muted:#B9C4D0; --accent:#F28C3C; --ok:#5FBF7F; --warn:#E5C15A; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; padding:14px 20px; background:var(--panel); border-bottom:1px solid var(--line); }
  h1 { margin:0; font-size:19px; } h1 span { color:var(--accent); }
  .chip { background:var(--panel2); border:1px solid var(--line); border-radius:999px; padding:3px 12px; color:var(--muted); font-size:13px; white-space:nowrap; }
  .chip b { color:var(--text); font-weight:600; }
  select, button, label.btn { font:inherit; color:var(--text); background:#1E3A5A; border:1px solid var(--line); border-radius:8px; padding:8px 14px; cursor:pointer; }
  button:hover, label.btn:hover { border-color:var(--accent); }
  button.primario { background:var(--accent); border-color:var(--accent); color:#1b1206; font-weight:600; }
  button:disabled { opacity:.5; cursor:wait; }
  button.activo { background:#1F4D35; border-color:var(--ok); }
  input[type=file] { display:none; }
  main { padding:18px 20px; max-width:1500px; margin:0 auto; }
  .controles { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns: 300px 1fr; gap:18px; align-items:start; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .pct { font-size:56px; font-weight:700; color:var(--accent); line-height:1; letter-spacing:-1px; }
  .pct.nulo { color:var(--muted); font-size:30px; }
  .etq { color:var(--muted); font-size:13px; margin-top:6px; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:14px 0 0; font-size:14px; }
  dt { color:var(--muted); } dd { margin:0; text-align:right; font-variant-numeric:tabular-nums; }
  .imgs { display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start; }
  @media (min-width: 1200px) { .imgs { grid-template-columns: 0.75fr 0.75fr 1fr 1fr; } }
  figure { margin:0; background:#071526; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  figure img { display:block; width:100%; height:auto; max-height:76vh; object-fit:contain; background:#071526; cursor:zoom-in; }
  figcaption { padding:7px 10px; font-size:13px; color:var(--muted); display:flex; justify-content:space-between; }
  figcaption b { color:var(--text); white-space:nowrap; margin-left:8px; }
  .vacio { min-height:340px; display:flex; align-items:center; justify-content:center; color:var(--muted); text-align:center; padding:20px; }
  h2 { font-size:14px; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); margin:18px 0 8px; }
  table { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
  th, td { padding:4px 6px; border-bottom:1px solid var(--line); text-align:right; }
  th:first-child, td:first-child { text-align:left; color:var(--muted); }
  th { color:var(--muted); font-weight:500; }
  .mejor { color:var(--ok); font-weight:600; }
  .aviso { color:var(--warn); font-size:13px; margin-top:8px; }
  .nota { color:var(--muted); font-size:12.5px; margin-top:10px; }
  #error { color:#ff9b8a; min-height:1.2em; font-size:14px; }
</style>
</head>
<body>
<header>
  <h1>RiceVi · <span>IA en la tolva</span></h1>
  <span class="chip" id="chipModelo">cargando…</span>
  <span class="chip" id="chipHash"></span>
  <label class="chip" style="cursor:default">Versión <select id="version" style="padding:2px 6px;margin-left:6px"></select></label>
</header>
<main>
  <div class="controles">
    <button class="primario" id="btnRep">Siguiente cuadro de prueba</button>
    <button id="btnAuto">▶ Automático (cada 6 s)</button>
    <button id="btnCam">Último cuadro de la CAM04</button>
    <label class="btn">Subir una foto<input id="archivo" type="file" accept="image/*"></label>
    <span id="error"></span>
  </div>
  <div class="grid">
    <section class="card" id="panel">
      <div class="pct nulo" id="pct">—</div>
      <div class="etq">material vegetal verde visible<br>fracción del área de la superficie, no masa</div>
      <dl id="detalle"></dl>
      <div class="aviso" id="aviso"></div>
      <h2>Prueba en video no visto</h2>
      <table id="metricas"></table>
      <p class="nota" id="nota"></p>
    </section>
    <section>
      <div class="imgs" id="imgs"><div class="card vacio" style="grid-column:1/-1">Pulsa «Siguiente cuadro de prueba» para pasar una imagen por el modelo.</div></div>
    </section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const fmt = (v, d = 2) => v == null ? "—" : Number(v).toLocaleString("es-CO", { minimumFractionDigits: d, maximumFractionDigits: d });
let auto = null, ocupado = false;

async function estado() {
  const e = await (await fetch("/api/estado")).json();
  const sel = $("version");
  sel.innerHTML = e.versiones.map(v => `<option ${e.modelo && e.modelo.carpeta === v ? "selected" : ""}>${v}</option>`).join("");
  if (e.modelo) {
    $("chipModelo").innerHTML = `Modelo <b>${e.modelo.carpeta}</b> · ${e.modelo.version} · umbral ${e.modelo.umbral}`;
    $("chipHash").innerHTML = `SHA-256 <b>${e.modelo.sha256}</b>`;
    tablaMetricas(e.modelo);
  } else {
    $("chipModelo").innerHTML = `<b>sin modelo</b>`;
    $("chipHash").textContent = e.sin_modelo;
    $("metricas").innerHTML = ""; $("nota").textContent = "";
  }
  $("btnRep").disabled = !e.repeticion;
  $("btnCam").title = e.camara.ultimo ? `${e.camara.ultimo} · hace ${e.camara.edad_s} s` : "La central no tiene cuadros de la cámara de la tolva";
  return e;
}

function tablaMetricas(m) {
  const a = m.metricas_prueba_modelo, b = m.metricas_prueba_regla_color;
  if (!a || !b) { $("metricas").innerHTML = ""; return; }
  const filas = [
    ["Error del % (puntos)", "error % (puntos, media)", 2, true],
    ["Fragmentos detectados", "recall fragmentos", 0, false, true],
    ["Detecciones correctas", "precisión fragmentos", 0, false, true],
    ["Dice clase verde", "Dice verde", 2],
  ];
  $("metricas").innerHTML = `<tr><th></th><th>Modelo</th><th>Regla de color</th></tr>` + filas.map(([t, k, d, menor, pct]) => {
    const x = a[k], y = b[k], f = v => pct ? fmt(100 * v, 0) + " %" : fmt(v, d);
    const mejorA = menor ? x < y : x > y;
    return `<tr><td>${t}</td><td class="${mejorA ? "mejor" : ""}">${f(x)}</td><td>${f(y)}</td></tr>`;
  }).join("");
  $("nota").textContent = `Prueba: 6 cuadros de un video que el modelo nunca vio (240 hojas anotadas a mano). La regla de color marca decenas de miles de manchas; casi ninguna es una hoja.`;
}

function mostrar(r) {
  $("error").textContent = "";
  const valido = r.estado === "valido";
  $("pct").className = "pct" + (valido ? "" : " nulo");
  $("pct").textContent = valido ? fmt(r.porcentaje) + " %" : (r.estado === "sin_modelo" ? "sin modelo" : r.estado.replace("_", " "));
  const filas = [
    ["Imagen", r.nombre], ["Fuente", { repeticion: "cuadro de prueba", camara: "CAM04 en vivo", subida: "foto subida" }[r.fuente]],
    ...(valido ? [["Píxeles verdes", r.pixeles_clase.toLocaleString("es-CO")], ["Tamaño", `${r.ancho} × ${r.alto}`],
                  ["Teselas", r.teselas], ["Inferencia", `${fmt(r.latencia_ms / 1000, 1)} s`]] : []),
    ...(r.edad_s != null ? [["Antigüedad", `${r.edad_s} s`]] : []),
  ];
  $("detalle").innerHTML = filas.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
  $("aviso").textContent = r.fuente === "subida" && valido ? "Foto fuera de las condiciones de entrenamiento: el resultado es orientativo." : (r.motivo || "");
  if (valido) {
    const u = t => `/api/imagen/${r.id}/${t}.jpg`;
    $("imgs").innerHTML = `
      <figure><a href="${u("original")}" target="_blank"><img src="${u("original")}" alt="Imagen original"></a><figcaption><span>Imagen</span><b>${r.nombre}</b></figcaption></figure>
      <figure><a href="${u("resultado")}" target="_blank"><img src="${u("resultado")}" alt="Material verde detectado en naranja"></a><figcaption><span>Modelo · verde detectado en naranja</span><b>${fmt(r.porcentaje)} %</b></figcaption></figure>
      <figure><img src="${u("zoom_original")}" alt="Acercamiento de la imagen"><figcaption><span>Acercamiento a la zona con más verde</span><b>imagen</b></figcaption></figure>
      <figure><img src="${u("zoom_resultado")}" alt="Acercamiento del resultado del modelo"><figcaption><span>Acercamiento</span><b>modelo</b></figcaption></figure>`;
  } else {
    $("imgs").innerHTML = `<div class="card vacio" style="grid-column:1/-1">${r.estado === "sin_modelo" ? "Sin modelo cargado: no se muestra ningún número." : (r.motivo || "Imagen no evaluable.")}</div>`;
  }
}

async function pedir(url, opciones = {}) {
  if (ocupado) return;
  ocupado = true;
  document.querySelectorAll("button:not(#btnAuto)").forEach(b => b.disabled = true);
  $("error").textContent = "Procesando…";
  try {
    const res = await fetch(url, { method: "POST", ...opciones });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.detail || `error ${res.status}`);
    mostrar(j);
  } catch (e) {
    $("error").textContent = e.message;
  } finally {
    ocupado = false;
    document.querySelectorAll("button:not(#btnAuto)").forEach(b => b.disabled = false);
  }
}

$("btnRep").onclick = () => pedir("/api/inferir/repeticion");
$("btnCam").onclick = () => pedir("/api/inferir/camara");
$("archivo").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const fd = new FormData(); fd.append("foto", f);
  pedir("/api/inferir/subir", { body: fd });
  e.target.value = "";
};
$("btnAuto").onclick = () => {
  if (auto) { clearInterval(auto); auto = null; $("btnAuto").classList.remove("activo"); $("btnAuto").textContent = "▶ Automático (cada 6 s)"; return; }
  $("btnAuto").classList.add("activo"); $("btnAuto").textContent = "■ Detener automático";
  pedir("/api/inferir/repeticion");
  auto = setInterval(() => pedir("/api/inferir/repeticion"), 6000);
};
$("version").onchange = async e => {
  $("error").textContent = "Cargando modelo…";
  const res = await fetch(`/api/modelo/${encodeURIComponent(e.target.value)}`, { method: "POST" });
  $("error").textContent = res.ok ? "" : "No se pudo cambiar de modelo";
  await estado();
};
estado();
setInterval(estado, 15000);
</script>
</body>
</html>
